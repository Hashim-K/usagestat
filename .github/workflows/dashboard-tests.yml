name: Test dashboard history

on:
  push:
    branches: [main]
    paths:
      - 'crates/ai-usage-daemon/src/dashboard*'
      - 'crates/ai-usage-daemon/tests/**'
      - '.github/workflows/dashboard-tests.yml'
  pull_request:
    paths:
      - 'crates/ai-usage-daemon/src/dashboard*'
      - 'crates/ai-usage-daemon/tests/**'
      - '.github/workflows/dashboard-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test crates/ai-usage-daemon/tests/*.test.cjs
